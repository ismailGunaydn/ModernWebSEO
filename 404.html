<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa bulunamadı | ModernWebSEO</title><meta name="robots" content="noindex"><style>
:root{color-scheme:light;--bg:#f7f5f0;--fg:#0f172a;--muted:#475569;--navy:#0b1220;--blue:#2563eb;--line:#e2ded4;--card:#fff;--sky:#dbeafe}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--blue);text-underline-offset:3px}
a:hover{color:var(--navy)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{background:var(--navy);border-bottom:1px solid #1e293b}
.top .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.brand{font-weight:700;text-decoration:none;color:#fff;font-size:18px;letter-spacing:.01em}
.top nav{display:flex;gap:16px;flex-wrap:wrap}
.top nav a{font-size:14px;color:#cbd5e1;text-decoration:none}
.top nav a:hover{color:#fff}
.hero{background:var(--navy);color:#fff;padding:44px 0 52px}
.kicker{color:#93c5fd;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700}
h1{font-size:clamp(30px,6vw,54px);line-height:1.08;margin:.3em 0 .4em;letter-spacing:-.01em}
h2{font-size:clamp(24px,3.6vw,32px);margin:64px 0 14px;color:var(--navy);padding-top:18px;border-top:1px solid var(--line)}
h3{font-size:19px;margin:0 0 6px;color:var(--navy)}
.lead{font-size:clamp(17px,2.2vw,20px);max-width:780px;color:#e2e8f0}
.hero a{color:#bfdbfe}
.btn{display:inline-block;padding:11px 18px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;margin:8px 10px 0 0;border:1px solid var(--blue)}
.btn:hover{background:#1d4ed8;color:#fff}
.btn.alt{background:transparent;color:#fff;border-color:#64748b}
.stats{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:34px;border-top:1px solid #334155}
.stat{padding:14px 12px 4px 0;color:#cbd5e1;font-size:14px}
.stat b{display:block;font:700 30px/1.1 Georgia,serif;color:#fff}
.answer{border-left:4px solid var(--blue);background:var(--card);padding:12px 16px;margin:0 0 18px;max-width:860px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);padding:18px}
.card ul{padding-left:18px;margin:8px 0 0}
.card li{margin:4px 0}
.card p{margin:6px 0}
.small{font-size:14px;color:var(--muted)}
.price{font:700 24px/1.2 Georgia,serif;color:var(--navy);margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.shot{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);background:#e5e7eb}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#eef2f7;color:var(--navy)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cols{columns:2 280px;column-gap:28px;padding-left:18px}
.cols li{break-inside:avoid;margin:3px 0}
details{border:1px solid var(--line);background:var(--card);padding:10px 14px;margin:10px 0}
summary{font-weight:700;cursor:pointer;color:var(--navy)}
ol.steps li{margin:8px 0}
footer{border-top:1px solid var(--line);margin-top:72px;padding:24px 0 40px;font-size:14px;color:var(--muted)}
@media (max-width:640px){.top nav{display:none}.hero{padding:32px 0 40px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head>
